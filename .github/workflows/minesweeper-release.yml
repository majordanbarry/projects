name: Release Minesweeper for Windows

on:
  push:
    tags:
      - 'minesweeper-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Minesweeper tag to publish'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Build and test the Windows x64 package
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual C++ build tools were not found.' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          New-Item -ItemType Directory package | Out-Null
          cl.exe /nologo /std:c++17 /EHsc /utf-8 /MT /O2 /W4 /Fe:package/Minesweeper.exe minesweeper/game/main.cpp minesweeper/game/game.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $gameOutput = @('1', 'f 1 1', 'F 1 1', '1 1') | & ./package/Minesweeper.exe
          $gameText = $gameOutput -join "`n"
          if ($LASTEXITCODE -ne 0 -or $gameText -notmatch '已取消 \(1,1\)' -or
              $gameText -notmatch '(?m)^  1  0  0' -or $gameText.Contains([char]27)) {
              throw 'The packaged game failed its redirected-input smoke test.'
          }

          Copy-Item minesweeper/LICENSE.txt package
          Compress-Archive -Path package/* -DestinationPath Minesweeper-Windows-x64.zip

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 10 / 11 x64：下载并解压 ZIP，双击 `Minesweeper.exe` 即可运行。

          对局棋盘会在尺寸足够的 Windows 终端里原地刷新。高级棋盘需要至少 94 列 × 26 行。
          '@
          gh release create $env:RELEASE_TAG Minesweeper-Windows-x64.zip --verify-tag --title "Minesweeper ${env:RELEASE_TAG}" --notes "$notes"
          exit $LASTEXITCODE
